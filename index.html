<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔥 산불 예측 대시보드</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.Default.css" />

    <!-- Custom CSS -->
    <style>
        body {
            display: flex;
            height: 100vh;
            overflow: hidden;
            font-family: 'Malgun Gothic', sans-serif;
        }
        #sidebar {
            width: 450px;
            min-width: 400px;
            height: 100vh;
            overflow-y: auto;
            background-color: #ffffff;
            border-right: 1px solid #dee2e6;
            padding: 1.5rem;
            box-shadow: 2px 0 5px rgba(0,0,0,0.1);
        }
        #map-container {
            flex-grow: 1;
            height: 100vh;
        }
        #map {
            width: 100%;
            height: 100%;
        }
        .chart-container {
            margin-top: 2rem;
        }
        h1, h2 {
            color: #343a40;
            font-weight: bold;
        }
        .btn-primary {
            background-color: #0d6efd;
            border-color: #0d6efd;
        }
        .legend-icon {
            width: 20px;
            height: 20px;
            margin-right: 8px;
            vertical-align: middle;
        }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <div id="sidebar">
        <h1 class="h3 mb-4">🔥 산불 예측 대시보드</h1>
        
        <!-- Date Filter -->
        <div class="mb-4 p-3 border rounded bg-light">
            <h2 class="h5 mb-3">날짜 필터</h2>
            <div class="input-group">
                <input type="date" id="start-date" class="form-control">
                <span class="input-group-text">~</span>
                <input type="date" id="end-date" class="form-control">
            </div>
            <div class="d-grid gap-2 mt-2">
                <button id="filter-button" class="btn btn-primary">필터 적용</button>
            </div>
        </div>

        <!-- Legend -->
        <div class="mb-4 p-3 border rounded">
            <h2 class="h5 mb-3">범례</h2>
            <ul class="list-unstyled">
                <li><img src="img/icon_red.png" alt="실제 산불" class="legend-icon"> 실제 산불</li>
                <li class="mt-2"><img src="img/icon_orange.png" alt="RandomForest 예측" class="legend-icon"> RandomForest 예측</li>
                <li class="mt-2"><img src="img/icon_blue.png" alt="LightGBM 예측" class="legend-icon"> LightGBM 예측</li>
            </ul>
        </div>

        <!-- Model Performance -->
        <div class="chart-container p-3 border rounded">
            <h2 class="h5 mb-3">모델 성능 비교</h2>
            <canvas id="metricsChart"></canvas>
        </div>
         <div class="mt-4 p-3 border rounded">
            <a href="dashboard.html">성능 비교 대시보드로 이동</a>
        </div>

    </div>

    <!-- Map -->
    <div id="map-container">
        <div id="map"></div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster/dist/leaflet.markercluster.js"></script>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Custom JS -->
    <script>
        // --- Initialize Map and Layers ---
        const map = L.map('map').setView([36.5, 127.5], 7);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        const trueFiresLayer = L.markerClusterGroup().addTo(map);
        const lgbmLayer = L.markerClusterGroup().addTo(map);
        const rfLayer = L.markerClusterGroup().addTo(map);

        const layers = {
            "실제 산불": trueFiresLayer,
            "RandomForest 예측": rfLayer,
            "LightGBM 예측": lgbmLayer
        };
        L.control.layers(null, layers).addTo(map);

        // --- Initialize Chart ---
        const ctx = document.getElementById('metricsChart').getContext('2d');
        const metricsChart = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: ['Accuracy', 'Precision', 'Recall', 'F1-Score'],
                datasets: []
            },
            options: {
                responsive: true,
                plugins: {
                    legend: { position: 'top' },
                    tooltip: { callbacks: { label: (c) => `${c.dataset.label}: ${c.raw.toFixed(2)}%` } }
                },
                scales: { y: { beginAtZero: true, ticks: { callback: (v) => `${v}%` } } }
            }
        });

        // --- Data Loading and Visualization ---
        async function fetchData(url) {
            const response = await fetch(url);
            if (!response.ok) {
                console.error(`Failed to load ${url}`);
                return [];
            }
            if (url.endsWith('.csv')) {
                const csvText = await response.text();
                const lines = csvText.split('\n').filter(line => line.trim() !== '');
                if (lines.length < 2) return [];
                const headers = lines[0].split(',').map(header => header.trim());
                const data = lines.slice(1).map(line => {
                    const values = line.split(',');
                    const obj = {};
                    headers.forEach((header, index) => {
                        obj[header] = values[index] ? values[index].trim() : '';
                    });
                    return obj;
                });
                return data;
            } else {
                return response.json();
            }
        }

        let damageCircle = null;

        function drawDamageCircle(lat, lon, damage) {
            if (damageCircle) {
                map.removeLayer(damageCircle);
            }
            if (damage === undefined) return;

            const radius = Math.sqrt(damage * 10000 / Math.PI); // damage is in ha, convert to m^2 to get radius in meters
            damageCircle = L.circle([lat, lon], {
                radius: radius,
                color: 'red',
                fillColor: '#f03',
                fillOpacity: 0.5
            }).addTo(map);
        }

        function addMarkersToLayer(layer, data, iconUrl, popupContentFn, isPrediction = false) {
            layer.clearLayers();
            data.forEach(item => {
                const lat = parseFloat(item.lat || item.LAT || (item.properties && item.properties.LAT) || item.REFINE_WGS84_LAT);
                const lon = parseFloat(item.lon || item.LON || (item.properties && item.properties.LON) || item.REFINE_WGS84_LOGT);

                if (!lat || !lon) return;

                const marker = L.marker([lat, lon], {
                    icon: L.icon({ iconUrl, iconSize: [25, 25] })
                });
                marker.bindPopup(popupContentFn(item));
                
                if (item.properties && item.properties.date) {
                    marker.fireDate = new Date(item.properties.date);
                }
                
                if (isPrediction) {
                    const key = `${lat.toFixed(6)},${lon.toFixed(6)}`;
                    const damage = damageMap[key];
                    marker.on('click', () => {
                        drawDamageCircle(lat, lon, damage);
                    });
                }

                layer.addLayer(marker);
            });
        }

        async function loadAllData() {
            // Load metrics
            const metricsData = await fetchData('static/metrics.json');
            if (metricsData) {
                const datasets = [];
                const colors = {
                    baseline: 'rgba(54, 162, 235, 0.7)',
                    random_forest: 'rgba(255, 159, 64, 0.7)'
                };
                for (const modelKey in metricsData) {
                    const modelMetrics = metricsData[modelKey];
                    datasets.push({
                        label: modelKey,
                        data: [
                            modelMetrics.accuracy * 100,
                            modelMetrics.precision * 100,
                            modelMetrics.recall * 100,
                            modelMetrics.f1 * 100
                        ],
                        backgroundColor: colors[modelKey] || 'rgba(255, 99, 132, 0.7)',
                    });
                }
                metricsChart.data.datasets = datasets;
                metricsChart.update();
            }

            // Load map data
            const trueFiresData = await fetchData('data/true_fires.geojson');
            if (trueFiresData.features) {
                 addMarkersToLayer(trueFiresLayer, trueFiresData.features, 'img/icon_red.png', 
                    item => `<b>실제 산불</b><br>주소: ${item.properties.full_address || 'N/A'}`
                );
            }

            const lgbmData = await fetchData('data/refined_predicted_fire_markers.json');
            const damageData = await fetchData('data/damage_predictions.json');
            const damageMap = {};
            if (damageData) {
                damageData.forEach(item => {
                    const key = `${item.lat.toFixed(6)},${item.lon.toFixed(6)}`;
                    damageMap[key] = item.predicted_damage;
                });
            }

            addMarkersToLayer(lgbmLayer, lgbmData, 'img/icon_blue.png', 
                item => {
                    const key = `${parseFloat(item.lat).toFixed(6)},${parseFloat(item.lon).toFixed(6)}`;
                    const damage = damageMap[key];
                    let popupContent = `<b>LGBM 예측</b><br>확률: ${item.probability ? item.probability.toFixed(2) : 'N/A'}`;
                    if (damage !== undefined) {
                        popupContent += `<br>예상 피해 면적: ${damage.toFixed(4)} ha`;
                    }
                    return popupContent;
                },
                true
            );

            const rfData = await fetchData('data/rf_predict.csv');
            addMarkersToLayer(rfLayer, rfData, 'img/icon_orange.png', 
                item => {
                    const key = `${parseFloat(item.LAT).toFixed(6)},${parseFloat(item.LON).toFixed(6)}`;
                    const damage = damageMap[key];
                    let popupContent = `<b>RF 예측</b><br>확률: ${item.FIRE_PROBABILITY ? parseFloat(item.FIRE_PROBABILITY).toFixed(2) : 'N/A'}`;
                    if (damage !== undefined) {
                        popupContent += `<br>예상 피해 면적: ${damage.toFixed(4)} ha`;
                    }
                    return popupContent;
                },
                true
            );
