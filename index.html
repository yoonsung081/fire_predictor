<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔥 산불 예측 대시보드</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.Default.css" />

    <!-- Custom CSS -->
    <style>
        body {
            display: flex;
            height: 100vh;
            overflow: hidden;
            font-family: 'Malgun Gothic', sans-serif;
        }
        #sidebar {
            width: 450px;
            min-width: 400px;
            height: 100vh;
            overflow-y: auto;
            background-color: #ffffff;
            border-right: 1px solid #dee2e6;
            padding: 1.5rem;
            box-shadow: 2px 0 5px rgba(0,0,0,0.1);
        }
        #map-container {
            flex-grow: 1;
            height: 100vh;
        }
        #map {
            width: 100%;
            height: 100%;
        }
        .chart-container {
            margin-top: 2rem;
        }
        h1, h2 {
            color: #343a40;
            font-weight: bold;
        }
        .btn-primary {
            background-color: #0d6efd;
            border-color: #0d6efd;
        }
        .legend-icon {
            width: 20px;
            height: 20px;
            margin-right: 8px;
            vertical-align: middle;
        }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <div id="sidebar">
        <h1 class="h3 mb-4">🔥 산불 예측 대시보드</h1>
        
        <!-- Date Filter -->
        <div class="mb-4 p-3 border rounded bg-light">
            <h2 class="h5 mb-3">날짜 필터</h2>
            <div class="input-group">
                <input type="date" id="start-date" class="form-control">
                <span class="input-group-text">~</span>
                <input type="date" id="end-date" class="form-control">
            </div>
            <div class="d-grid gap-2 mt-2">
                <button id="filter-button" class="btn btn-primary">필터 적용</button>
            </div>
        </div>

        <!-- Legend -->
        <div class="mb-4 p-3 border rounded">
            <h2 class="h5 mb-3">범례</h2>
            <ul class="list-unstyled">
                <li><img src="img/icon_red.png" alt="실제 산불" class="legend-icon"> 실제 산불</li>
                <li class="mt-2"><img src="img/icon_orange.png" alt="RandomForest 예측" class="legend-icon"> RandomForest 예측</li>
                <li class="mt-2"><img src="img/icon_blue.png" alt="LightGBM 예측" class="legend-icon"> LightGBM 예측</li>
            </ul>
        </div>

        <!-- Model Performance -->
        <div class="chart-container p-3 border rounded">
            <h2 class="h5 mb-3">모델 성능 비교</h2>
            <canvas id="metricsChart"></canvas>
        </div>
         <div class="mt-4 p-3 border rounded">
            <a href="dashboard.html">성능 비교 대시보드로 이동</a>
        </div>

    </div>

    <!-- Map -->
    <div id="map-container">
        <div id="map"></div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster/dist/leaflet.markercluster.js"></script>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Custom JS Modules -->
    <script type="module" src="static/js/data.js"></script>
    <script type="module" src="static/js/map.js"></script>
    <script type="module" src="static/js/chart.js"></script>
    <script type="module" src="static/js/app.js"></script>

</body>
</html>
