<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔥 산불 예측 대시보드</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.Default.css" />

    <!-- Custom CSS -->
    <style>
        body {
            display: flex;
            height: 100vh;
            overflow: hidden;
            font-family: 'Malgun Gothic', sans-serif;
        }
        #sidebar {
            width: 450px;
            min-width: 400px;
            height: 100vh;
            overflow-y: auto;
            background-color: #ffffff;
            border-right: 1px solid #dee2e6;
            padding: 1.5rem;
            box-shadow: 2px 0 5px rgba(0,0,0,0.1);
        }
        #map-container {
            flex-grow: 1;
            height: 100vh;
        }
        #map {
            width: 100%;
            height: 100%;
        }
        .chart-container {
            margin-top: 2rem;
        }
        h1, h2 {
            color: #343a40;
            font-weight: bold;
        }
        .btn-primary {
            background-color: #0d6efd;
            border-color: #0d6efd;
        }
        .legend-icon {
            width: 20px;
            height: 20px;
            margin-right: 8px;
            vertical-align: middle;
        }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <div id="sidebar">
        <h1 class="h3 mb-4">🔥 산불 예측 대시보드</h1>
        
        <!-- Date Filter -->
        <div class="mb-4 p-3 border rounded bg-light">
            <h2 class="h5 mb-3">날짜 필터</h2>
            <div class="input-group">
                <input type="date" id="start-date" class="form-control">
                <span class="input-group-text">~</span>
                <input type="date" id="end-date" class="form-control">
            </div>
            <div class="d-grid gap-2 mt-2">
                <button id="filter-button" class="btn btn-primary">필터 적용</button>
            </div>
        </div>

        <!-- Legend -->
        <div class="mb-4 p-3 border rounded">
            <h2 class="h5 mb-3">범례</h2>
            <ul class="list-unstyled">
                <li><img src="img/icon_red.png" alt="실제 산불" class="legend-icon"> 실제 산불</li>
                <li class="mt-2"><img src="img/icon_blue.png" alt="LightGBM 예측" class="legend-icon"> LightGBM 예측</li>
                <li class="mt-2"><img src="img/icon_orange.png" alt="RandomForest 예측" class="legend-icon"> RandomForest 예측</li>
                <li class="mt-2"><img src="img/icon_purple.png" alt="미래 예측 산불" class="legend-icon"> 미래 예측 산불 (경로 탐색)</li>
            </ul>
        </div>

        <!-- Model Performance -->
        <div class="chart-container p-3 border rounded">
            <h2 class="h5 mb-3">모델 성능 비교</h2>
            <canvas id="metricsChart"></canvas>
        </div>
         <div class="mt-4 p-3 border rounded">
            <a href="dashboard.html">성능 비교 대시보드로 이동</a>
        </div>

    </div>

    <!-- Map -->
    <div id="map-container">
        <div id="map"></div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster/dist/leaflet.markercluster.js"></script>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <!-- PapaParse for CSV parsing -->
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.3.2/papaparse.min.js"></script>

    <!-- Custom JS -->
    <script>
        // --- Initialize Map and Layers ---
        
        const map = L.map('map').setView([36.5, 127.5], 7);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        const trueFiresLayer = L.markerClusterGroup().addTo(map);
        const lgbmLayer = L.markerClusterGroup().addTo(map);
        const rfLayer = L.markerClusterGroup().addTo(map);
        const futurePredLayer = L.markerClusterGroup().addTo(map);
        const fireStationLayer = L.layerGroup().addTo(map); // 소방서는 클러스터링하지 않음
        let currentRouteLine = null; // 현재 경로를 저장할 변수

        const layers = {
            "실제 산불": trueFiresLayer,
            "LightGBM 예측": lgbmLayer,
            "RandomForest 예측": rfLayer,
            "미래 예측 산불": futurePredLayer,
            "전국 소방서": fireStationLayer
        };
        L.control.layers(null, layers).addTo(map);

        // --- Initialize Chart ---
        
        const ctx = document.getElementById('metricsChart').getContext('2d');
        const metricsChart = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: ['Accuracy', 'Precision', 'Recall', 'F1-Score'],
                datasets: []
            },
            options: {
                responsive: true,
                plugins: {
                    legend: { position: 'top' },
                    tooltip: { callbacks: { label: (c) => `${c.dataset.label}: ${c.raw.toFixed(2)}%` } }
                },
                scales: { y: { beginAtZero: true, ticks: { callback: (v) => `${v}%` } } }
            }
        });

        // --- Data Loading and Visualization ---
        
        async function fetchData(url) {
            const response = await fetch(url);
            if (!response.ok) {
                console.error(`Failed to load ${url}`);
                return [];
            }
            // CSV 파일인 경우 PapaParse로 파싱
            if (url.endsWith('.csv')) {
                const csvText = await response.text();
                return new Promise(resolve => {
                    Papa.parse(csvText, {
                        header: true,
                        skipEmptyLines: true,
                        complete: (results) => resolve(results.data)
                    });
                });
            }
            return response.json();
        }

        function addMarkersToLayer(layer, data, iconUrl, popupContentFn, isFuturePrediction = false) {
            layer.clearLayers();
            data.forEach(item => {
                // 데이터 형식에 따라 위도, 경도 키를 확인
                const lat = item.lat || item.WGS84위도;
                const lon = item.lon || item.WGS84경도;

                if (!lat || !lon) return;

                const marker = L.marker([lat, lon], {
                    icon: L.icon({ iconUrl, iconSize: [25, 25] })
                });
                marker.bindPopup(popupContentFn(item));
                
                if (item.properties && item.properties.date) {
                    marker.fireDate = new Date(item.properties.date);
                }
                
                // 미래 예측 마커에 경로 탐색 이벤트 추가
                if (isFuturePrediction) {
                    marker.on('click', () => findAndDrawRoute([lat, lon]));
                }

                layer.addLayer(marker);
            });
        }

        async function loadAllData() {
            // Load metrics
            const metricsData = await fetchData('static/metrics.json');
            if (metricsData) {
                const datasets = [];
                const colors = {
                    baseline: 'rgba(54, 162, 235, 0.7)',
                    random_forest: 'rgba(255, 159, 64, 0.7)'
                };
                for (const modelKey in metricsData) {
                    const modelMetrics = metricsData[modelKey];
                    datasets.push({
                        label: modelKey,
                        data: [
                            modelMetrics.accuracy * 100,
                            modelMetrics.precision * 100,
                            modelMetrics.recall * 100,
                            modelMetrics.f1 * 100
                        ],
                        backgroundColor: colors[modelKey] || 'rgba(255, 99, 132, 0.7)',
                    });
                }
                metricsChart.data.datasets = datasets;
                metricsChart.update();
            }

            // Load map data
            const trueFiresData = await fetchData('data/true_fires.geojson');
            addMarkersToLayer(trueFiresLayer, trueFiresData.features, 'img/icon_red.png', 
                item => `<b>실제 산불</b><br>주소: ${item.properties.full_address || 'N/A'}`
            );

            const lgbmData = await fetchData('static/lgbm_predictions.json');
            addMarkersToLayer(lgbmLayer, lgbmData, 'img/icon_blue.png', 
                item => `<b>LGBM 예측</b><br>확률: ${item.fire_probability ? item.fire_probability.toFixed(2) : 'N/A'}`
            );

            const rfData = await fetchData('static/rf_predictions.json');
            addMarkersToLayer(rfLayer, rfData, 'img/icon_orange.png', 
                item => `<b>RF 예측</b><br>확률: ${item.fire_probability ? item.fire_probability.toFixed(2) : 'N/A'}`
            );
            
            // Load future predictions
            const futureData = await fetchData('data/future_predictions.json');
            addMarkersToLayer(futurePredLayer, futureData, 'img/icon_purple.png', 
                item => `<b>미래 예측 (${item.date})</b><br>위치: ${item.location_sido} ${item.location_sigungu}<br>확률: ${item.fire_probability.toFixed(2)}<br><b style='color:blue;'>클릭하여 가장 가까운 소방서 경로 탐색</b>`,
                true // isFuturePrediction = true
            );

            // Load fire stations
            const fireStationsData = await fetchData('data/fire_stations_nationwide.csv');
            window.fireStations = fireStationsData; // 전역 변수에 저장하여 경로 탐색 시 사용
            addMarkersToLayer(fireStationLayer, fireStationsData, 'img/icon_station.png', 
                item => `<b>${item.서명}</b><br>주소: ${item.주소}`
            );
        }

        // --- Pathfinding Logic ---
        function haversineDistance(coords1, coords2) {
            function toRad(x) {
                return x * Math.PI / 180;
            }

            const lat1 = coords1[0];
            const lon1 = coords1[1];
            const lat2 = coords2[0];
            const lon2 = coords2[1];

            const R = 6371; // km
            const dLat = toRad(lat2 - lat1);
            const dLon = toRad(lon2 - lon1);
            const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                      Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
                      Math.sin(dLon / 2) * Math.sin(dLon / 2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            return R * c;
        }

        function findAndDrawRoute(fireCoords) {
            if (!window.fireStations || window.fireStations.length === 0) {
                alert('소방서 데이터가 로드되지 않았습니다.');
                return;
            }

            let closestStation = null;
            let minDistance = Infinity;

            window.fireStations.forEach(station => {
                const stationCoords = [parseFloat(station.WGS84위도), parseFloat(station.WGS84경도)];
                if (isNaN(stationCoords[0]) || isNaN(stationCoords[1])) return;

                const distance = haversineDistance(fireCoords, stationCoords);
                if (distance < minDistance) {
                    minDistance = distance;
                    closestStation = station;
                }
            });

            if (closestStation) {
                const stationCoords = [parseFloat(closestStation.WGS84위도), parseFloat(closestStation.WGS84경도)];
                
                // 이전 경로가 있으면 지도에서 제거
                if (currentRouteLine) {
                    map.removeLayer(currentRouteLine);
                }

                // 새 경로 생성 및 추가
                currentRouteLine = L.polyline([fireCoords, stationCoords], {
                    color: 'red',
                    weight: 3,
                    opacity: 0.7
                }).addTo(map);
                
                currentRouteLine.bindPopup(`<b>최단 경로</b><br>소방서: ${closestStation.서명}<br>거리: ${minDistance.toFixed(2)} km`).openPopup();

                // 경로가 잘 보이도록 지도 범위 조정
                map.fitBounds(currentRouteLine.getBounds().pad(0.1));
            }
        }


        // --- Filtering Logic ---
        document.getElementById('filter-button').addEventListener('click', () => {
            const startDate = document.getElementById('start-date').valueAsDate;
            const endDate = document.getElementById('end-date').valueAsDate;

            if (!startDate || !endDate) {
                alert('시작 날짜와 종료 날짜를 모두 선택해주세요.');
                return;
            }
            endDate.setHours(23, 59, 59, 999);

            [trueFiresLayer, lgbmLayer, rfLayer, futurePredLayer].forEach(layer => {
                let visibleMarkers = [];
                layer.eachLayer(marker => {
                    // 날짜 정보가 있는 마커만 필터링
                    if (marker.fireDate) {
                         if (marker.fireDate >= startDate && marker.fireDate <= endDate) {
                            visibleMarkers.push(marker);
                        }
                    } else {
                        // 날짜 정보가 없는 마커는 항상 보이도록 함 (예: 미래 예측)
                        visibleMarkers.push(marker);
                    }
                });
                layer.clearLayers();
                layer.addLayers(visibleMarkers);
            });
        });

        // --- Initial Load ---
        loadAllData();

    </script>

</body>
</html>
