<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔥 산불 예측 지도</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-search/dist/leaflet-search.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://npmcdn.com/flatpickr/dist/l10n/ko.js"></script>
    
    <style>
        body { margin: 0; overflow: hidden; }
        #map { height: 100vh; width: 100vw; }
        .analysis-link {
            position: absolute;
            top: 100px; /* 돋보기 바로 아래로 내림 */
            right: 10px;
            background: #fff;
            padding: 6px 10px;
            border-radius: 4px;
            border: 1px solid #ccc;
            text-decoration: none;
            z-index: 1000;
            font-size: 14px;
            color: #333;
        }
        .date-filter {
            position: absolute;
            top: 10px;
            left: 80px; /* 컨트롤 버튼과 겹치지 않도록 조정 */
            background: rgba(255, 255, 255, 0.9);
            padding: 10px;
            border-radius: 5px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        .date-filter > div {
            display: flex;
            align-items: center;
            margin-bottom: 5px;
        }
        .date-filter input, .date-filter button, .date-filter span, .date-filter label {
            margin: 0 5px;
            padding: 5px;
            border: 1px solid #ddd;
            border-radius: 3px;
        }
        .date-filter button {
            cursor: pointer;
            background-color: #007bff;
            color: white;
            border: none;
        }
        .date-filter button:hover {
            background-color: #0056b3;
        }
        .legend {
            position: absolute;
            bottom: 20px;
            left: 10px;
            background: rgba(255, 255, 255, 0.9);
            padding: 10px;
            border-radius: 5px;
            z-index: 1000;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        .legend h4 {
            margin-top: 0;
            margin-bottom: 10px;
            color: #333;
        }
        .legend div {
            display: flex;
            align-items: center;
            margin-bottom: 5px;
            color: #555;
        }
        .legend img {
            width: 20px;
            height: 20px;
            margin-right: 8px;
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            .date-filter {
                flex-direction: column;
                left: 10px;
                right: 10px;
                width: auto;
                top: 10px;
            }
            .date-filter > div {
                flex-direction: column;
                align-items: stretch;
                margin-bottom: 10px;
            }
            .date-filter input, .date-filter button, .date-filter span, .date-filter label {
                margin: 5px 0;
            }
            .analysis-link {
                top: auto;
                bottom: 10px;
                right: 10px;
                font-size: 12px;
                padding: 4px 8px;
            }
            .legend {
                bottom: 60px; /* Adjust to not overlap with analysis link on small screens */
                left: 10px;
                right: 10px;
                width: auto;
                padding: 8px;
            }
            .legend h4 {
                font-size: 1em;
            }
            .legend div {
                font-size: 0.9em;
            }
            .legend img {
                width: 18px;
                height: 18px;
            }
        }

        @media (max-width: 480px) {
            .date-filter input, .date-filter button, .date-filter span, .date-filter label {
                font-size: 0.9em;
            }
            .analysis-link {
                font-size: 0.8em;
                padding: 3px 6px;
            }
            .legend {
                font-size: 0.8em;
                padding: 5px;
            }
            .legend img {
                width: 15px;
                height: 15px;
            }
        }
    </style>
</head>
<body>
    <a href="dashboard.html" class="analysis-link">📊 분석 보기</a>
    <div class="date-filter">
        <div>
            <label>조회할 범위:</label>
            <input type="text" id="start-date" placeholder="YYYY-MM-DD">
            <span>~</span>
            <input type="text" id="end-date" placeholder="YYYY-MM-DD">
            <button id="filter-button">적용</button>
        </div>
        <div id="date-range-display" style="font-size: 12px; color: #555; text-align: center; margin-top: 5px;">
            <!-- 날짜 범위가 여기에 표시됩니다. -->
        </div>
    </div>
    <div class="legend">
        <h4>범례</h4>
        <div><img src="img/icon_red.png" alt="실제 산불"> 실제 산불</div>
        <div><img src="img/icon_blue.png" alt="LightGBM 예측"> LightGBM 예측</div>
        <div><img src="img/icon_orange.png" alt="RandomForest 예측"> RandomForest 예측</div>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-search/dist/leaflet-search.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    

    <script>
        const map = L.map('map').setView([37.5, 128.2], 7);

        // URL 파라미터에서 lat, lon 읽기
        const urlParams = new URLSearchParams(window.location.search);
        const initialLat = parseFloat(urlParams.get('lat'));
        const initialLon = parseFloat(urlParams.get('lon'));

        if (!isNaN(initialLat) && !isNaN(initialLon)) {
            map.setView([initialLat, initialLon], 12); // 특정 위치로 이동 및 줌

            const initialSido = urlParams.get('sido');
            const initialSigungu = urlParams.get('sigungu');
            const locationName = (initialSido && initialSigungu) ? `${initialSido} ${initialSigungu}` : '예측 산불 위치';

            L.circle([initialLat, initialLon], {
                color: 'red',
                fillColor: '#f03',
                fillOpacity: 0.5,
                radius: 500 // 500 meters radius
            }).addTo(map).bindPopup(`<b>${locationName}</b><br>예측 위치`);
        }

        const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: 'OpenStreetMap' }).addTo(map);
        const satellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { attribution: 'Esri' });

        const trueFires = L.layerGroup().addTo(map);
        const lgbmPredictions = L.layerGroup().addTo(map);
        const rfPredictions = L.layerGroup().addTo(map);

        L.control.layers(
            { "지도": osm, "위성": satellite },
            {
                "실제 산불": trueFires,
                "LightGBM 예측": lgbmPredictions,
                "RandomForest 예측": rfPredictions
            }
        ).addTo(map);

        const searchControl = new L.Control.Search({
            url: 'https://nominatim.openstreetmap.org/search?format=json&q={s}',
            jsonpParam: 'json_callback',
            propertyName: 'display_name',
            propertyLoc: ['lat','lon'],
            autoCollapse: true,
            autoType: false,
            minLength: 2,
            zoom: 12
        });

        searchControl.on('search:locationfound', function(e) {
            map.setView(e.latlng, 12);
        });

        map.addControl(searchControl);

        flatpickr("#start-date", { locale: "ko" });
        flatpickr("#end-date", { locale: "ko" });

        let allFiresData = [];

        // Haversine 거리 계산 함수 (킬로미터 단위)
        function haversineDistance(lat1, lon1, lat2, lon2) {
            const R = 6371; // 지구 반지름 (킬로미터)
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a =
                Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon / 2) * Math.sin(dLon / 2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            return R * c; // 킬로미터 단위 거리
        }

        function findClosestPredictionForFires(predictions, actualFires) {
            const closestPredictions = [];
            const usedPredictionIndexes = new Set(); // 한 번 사용된 예측은 다시 사용하지 않도록 관리

            actualFires.forEach(fire => {
                let closestPred = null;
                let minDistance = Infinity;
                let closestPredIndex = -1;

                const fireLatLng = L.latLng(fire.geometry.coordinates[1], fire.geometry.coordinates[0]);

                predictions.forEach((pred, index) => {
                    // 아직 사용되지 않은 예측 중에서만 탐색
                    if (!usedPredictionIndexes.has(index)) {
                        const predLatLng = L.latLng(pred.geometry.coordinates[1], pred.geometry.coordinates[0]);
                        const distance = haversineDistance(fireLatLng.lat, fireLatLng.lng, predLatLng.lat, predLatLng.lng);

                        if (distance < minDistance) {
                            minDistance = distance;
                            closestPred = pred;
                            closestPredIndex = index;
                        }
                    }
                });

                if (closestPred) {
                    closestPredictions.push(closestPred);
                    usedPredictionIndexes.add(closestPredIndex); // 사용된 예측 인덱스 추가
                }
            });

            return closestPredictions;
        }

        function updateAllMarkers(startDate, endDate, initialFires = null) {
            trueFires.clearLayers();
            lgbmPredictions.clearLayers();
            rfPredictions.clearLayers();

            const filteredFires = initialFires || allFiresData.filter(feature => {
                const fireDate = new Date(feature.properties.발생일시_년, feature.properties.발생일시_월 - 1, feature.properties.발생일시_일);
                return fireDate >= startDate && fireDate <= endDate;
            });

            if (filteredFires.length === 0) {
                alert("해당 기간에 산불 데이터가 없습니다.");
                return;
            }

            L.geoJSON(filteredFires, {
                pointToLayer: (feature, latlng) => {
                    return L.marker(latlng, {
                        icon: L.icon({
                            iconUrl: 'img/icon_red.png',
                            iconSize: [20, 20],
                            iconAnchor: [10, 10]
                        })
                    }).bindPopup(`<b>실제 산불</b><br>${feature.properties.full_address || ''}`);
                }
            }).addTo(trueFires);

            const addPredictionMarkers = (predictions, layerGroup, iconUrl, modelName) => {
                L.geoJSON(predictions, {
                    pointToLayer: (feature, latlng) => {
                        // 마커가 겹치지 않도록 동쪽으로 약간(약 800미터) 이동시킵니다.
                        const offsetLatLng = L.latLng(latlng.lat, latlng.lng + 0.008);

                        return L.marker(offsetLatLng, {
                            icon: L.icon({
                                iconUrl: iconUrl,
                                iconSize: [20, 20],
                                iconAnchor: [10, 10]
                            })
                        }).bindPopup(`<b>${modelName}</b><br>예측 확률: ${feature.properties.fire_probability ? feature.properties.fire_probability.toFixed(2) : 'N/A'}`);
                    }
                }).addTo(layerGroup);
            };

            const parseCsv = (csvText) => {
                const lines = csvText.trim().split('\n');
                const headers = lines[0].split(',');
                const predictions = [];
                for (let i = 1; i < lines.length; i++) {
                    const values = lines[i].split(',');
                    if (values.length === headers.length) {
                        const lat = parseFloat(values[0]);
                        const lon = parseFloat(values[1]);
                        const probability = parseFloat(values[2]);
                        if (!isNaN(lat) && !isNaN(lon) && !isNaN(probability)) {
                            predictions.push({
                                type: "Feature",
                                geometry: { type: "Point", coordinates: [lon, lat] },
                                properties: { fire_probability: probability }
                            });
                        }
                    }
                }
                return predictions;
            };

            // 1. LightGBM 예측 로드 및 표시
            fetch('data/fixed_predict.csv')
                .then(res => res.text())
                .then(csvText => {
                    const lgbmData = parseCsv(csvText);
                    const matchedLgbm = findClosestPredictionForFires(lgbmData, filteredFires);
                    addPredictionMarkers({ type: "FeatureCollection", features: matchedLgbm }, lgbmPredictions, 'img/icon_blue.png', 'LightGBM 예측');
                })
                .catch(error => console.error('Error fetching fixed_predict.csv:', error));

            // 2. RandomForest 예측 로드 및 표시
            fetch('data/rf_predict.csv')
                .then(res => res.text())
                .then(csvText => {
                    const rfData = parseCsv(csvText);
                    const matchedRf = findClosestPredictionForFires(rfData, filteredFires);
                    addPredictionMarkers({ type: "FeatureCollection", features: matchedRf }, rfPredictions, 'img/icon_orange.png', 'RandomForest 예측');
                })
                .catch(error => console.error('Error fetching rf_predict.csv:', error));
        }

        fetch('data/true_fires.geojson')
            .then(res => res.json())
            .then(data => {
                allFiresData = data.features;
                allFiresData.sort((a, b) => {
                    const dateA = new Date(a.properties.발생일시_년, a.properties.발생일시_월 - 1, a.properties.발생일시_일);
                    const dateB = new Date(b.properties.발생일시_년, b.properties.발생일시_월 - 1, b.properties.발생일시_일);
                    return dateB - dateA; // 최신 날짜 순으로 정렬
                });

                if (allFiresData.length > 0) {
                    // 전체 데이터 기간 표시
                    const latestFire = allFiresData[0].properties;
                    const earliestFire = allFiresData[allFiresData.length - 1].properties;
                    const latestDateStr = `${latestFire.발생일시_년}-${String(latestFire.발생일시_월).padStart(2, '0')}-${String(latestFire.발생일시_일).padStart(2, '0')}`;
                    const earliestDateStr = `${earliestFire.발생일시_년}-${String(earliestFire.발생일시_월).padStart(2, '0')}-${String(earliestFire.발생일시_일).padStart(2, '0')}`;
                    document.getElementById('date-range-display').textContent = `조회 가능 기간: ${earliestDateStr} ~ ${latestDateStr}`;

                    // 초기 지도 로딩 시, 가장 최근 월의 데이터를 보여줌
                    const latestMonthFires = allFiresData.filter(fire => {
                        const fireDate = new Date(fire.properties.발생일시_년, fire.properties.발생일시_월 - 1, fire.properties.발생일시_일);
                        const latestFireDate = new Date(latestFire.발생일시_년, latestFire.발생일시_월 - 1, latestFire.발생일시_일);
                        return fireDate.getFullYear() === latestFireDate.getFullYear() && fireDate.getMonth() === latestFireDate.getMonth();
                    });

                    const firstDayOfLatestMonth = new Date(latestFire.발생일시_년, latestFire.발생일시_월 - 1, 1);
                    const lastDayOfLatestMonth = new Date(latestFire.발생일시_년, latestFire.발생일시_월, 0);

                    document.getElementById('start-date').value = firstDayOfLatestMonth.toISOString().split('T')[0];
                    document.getElementById('end-date').value = lastDayOfLatestMonth.toISOString().split('T')[0];

                    updateAllMarkers(firstDayOfLatestMonth, lastDayOfLatestMonth, latestMonthFires);
                } else {
                    alert("산불 데이터가 없습니다.");
                }
            });

        document.getElementById('filter-button').addEventListener('click', () => {
            const startDate = new Date(document.getElementById('start-date').value);
            const endDate = new Date(document.getElementById('end-date').value);
            updateAllMarkers(startDate, endDate);
        });
    </script>
</body>
</html>
